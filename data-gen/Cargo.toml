[package]
name = "reverie-datagen"
version = "0.1.0"
edition = "2021"
description = "Fast deterministic generator of ProsQA-style latent-planning reasoning tasks."

[[bin]]
name = "reverie-datagen"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Nothing here on purpose. The PRNG and the JSON writer live in main.rs so a
# dependency bump can't shift the generated bytes.
[dependencies]
